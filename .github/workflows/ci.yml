name: Foundation integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: python -m pip install '.[validation]'
      - name: Validate AI entry points
        run: python scripts/validate_agent_docs.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild generated retrieval artifacts
        run: python scripts/build_knowledge_graph.py
      - name: Prove generated artifacts are current
        run: git diff --exit-code -- knowledge/
      - name: Exercise the evaluator
        run: python scripts/evaluate_principles.py examples/implementation-manifest.example.json --repo tests/fixtures/problematic_runtime --output /tmp/evaluation-report.json
      - name: Validate every JSON file parses
        run: python -c 'import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path(".").rglob("*.json")]'

  cosmos-explorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/cosmos-graph-explorer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: examples/cosmos-graph-explorer/package-lock.json
      - name: Install pinned explorer dependencies
        run: npm ci
      - name: Type-check, test, build, and verify dynamic Cosmos loading
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev
